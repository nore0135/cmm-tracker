<!DOCTYPE html>
<html>
<head>
  <title>CMM Parts Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>📊 CMM Parts Tracker</h1>
  </div>

  <div class="container">
    
    <!-- Dashboard Section -->
    <div id="dashboard" class="section">
      <h2>Dashboard</h2>
      <div id="stats" class="stats-box">
        <p>Loading...</p>
      </div>
    </div>

    <!-- Add New Part Form -->
    <div id="parts" class="section">
      <h2>Add New Part</h2>
      <form onsubmit="addPart(event)">
        <input type="text" id="partName" placeholder="Part Name" required>
        <input type="text" id="partNumber" placeholder="Part Number" required>
        <button type="submit">Add Part</button>
      </form>
      <div id="partsList" class="parts-list">
        <p>Loading parts...</p>
      </div>
    </div>

    <!-- Monthly Check Section -->
    <div id="monthly" class="section">
      <h2>Monthly Updates</h2>
      <div>
        <label>Select Month:</label>
        <select id="monthSelect">
          <option value="01">January</option>
          <option value="02">February</option>
          <option value="03">March</option>
          <!-- ... all months ... -->
        </select>
      </div>
      <div id="monthlyStatus" class="monthly-box">
        <p>Select a month</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
